# One-off probe of the data.gov.my API (Slice 3). Runs on GitHub's servers because the
# development workspace cannot reach the API. Saves its findings to data/probe-report.json
# on the staging branch. To be removed once the real data pipeline is in place.
name: Probe data API

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/probe-data-api.yml'
      - 'scripts/probe-api.mjs'

permissions:
  contents: write

concurrency:
  group: probe-data-api
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Probe the API
        run: node scripts/probe-api.mjs

      - name: Save the report to the staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe-report.json
          if git diff --cached --quiet; then
            echo "No change in the report."
          else
            git commit -m "Add data API probe report" -m "Written by the probe workflow on GitHub's servers."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
